[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daftar"
version = "0.1.6"
description = "Record what produced each computational result: environment, code, parameters, seeds, inputs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Aslan Satary Dizaji"}]
keywords = ["reproducibility", "provenance", "simulation", "computational-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []   # deliberately none: stdlib only

[project.urls]
Homepage = "https://github.com/aslansd/daftar"
Repository = "https://github.com/aslansd/daftar"
Issues = "https://github.com/aslansd/daftar/issues"

[project.optional-dependencies]
jaxley = ["jaxley"]
cpm = ["cpm-toolbox"]
meltingpot = ["dm-meltingpot"]
dev = ["pytest>=7", "numpy"]
all = ["jaxley", "cpm-toolbox", "dm-meltingpot"]

[project.scripts]
daftar = "daftar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
